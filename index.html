<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Nurture Bulletin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="masthead">
        <div class="masthead__row">
          <a class="masthead__logo" href="./">
            <span class="masthead__mark" aria-hidden="true">N</span>
            <span class="masthead__wordmark">The Nurture Bulletin</span>
          </a>
          <div class="masthead__actions">
            <button id="themeToggle" class="btn" type="button" aria-pressed="false">Night Edition</button>
            <a class="btn btn--solid" href="./feed.xml">RSS Feed</a>
          </div>
        </div>
        <div class="masthead__strip">
          <span>Internal Announcements</span>
          <span class="masthead__divider" aria-hidden="true">&mdash;</span>
          <span id="updatedPill"></span>
          <span class="masthead__divider" aria-hidden="true">&mdash;</span>
          <span id="countPill" class="masthead__count">Loading&hellip;</span>
        </div>
      </header>

      <section class="toolbar">
        <label class="search-box" for="searchInput">
          <span class="search-box__label">Search the archive</span>
          <input id="searchInput" type="search" placeholder="Title, body, author, or “3 hours ago”&hellip;" />
        </label>
      </section>

      <section id="errorBox" class="state-card state-card--error hidden" role="alert"></section>
      <section id="loadingBox" class="state-card">Fetching the latest dispatches&hellip;</section>

      <section id="cardsGrid" class="cards-grid hidden" aria-live="polite"></section>
      <section id="emptyState" class="state-card hidden">No dispatches match your search.</section>
    </main>

    <template id="cardTemplate">
      <article class="card">
        <a class="card__link" href="#">
          <span class="card__index" aria-hidden="true"></span>
          <div class="card__content">
            <div class="card__meta">
              <span class="card__date"></span>
              <span class="card__author hidden"></span>
            </div>
            <h2 class="card__title"></h2>
            <p class="card__desc"></p>
            <span class="card__cta" aria-hidden="true">Read full dispatch &rarr;</span>
          </div>
        </a>
      </article>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
