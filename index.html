<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nurture Announcements</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="app-header">
        <div class="brand">
          <div class="brand__copy">
            <h1>Nurture Announcements</h1>
          </div>
        </div>
        <div class="header-actions">
          <button id="themeToggle" class="btn btn--ghost" type="button" aria-pressed="false">
            Dark mode
          </button>
          <a class="btn btn--primary" href="./feed.xml">RSS</a>
        </div>
      </header>

      <section class="hero-panel">
        <div class="hero-panel__copy">
          <p>Mirrors Nurture's announcement page, refreshed on a schedule and linked back to the source posts.</p>
          <div class="hero-panel__stats" id="metaBar">
            <div class="stat-card">
              <span class="stat-card__label">Announcements</span>
              <span id="countPill" class="stat-card__value">Loading…</span>
            </div>
            <div class="stat-card stat-card--wide">
              <span class="stat-card__label">Last sync</span>
              <span id="updatedPill" class="stat-card__value stat-card__value--muted"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="toolbar">
        <label class="search-box" for="searchInput">
          <span class="search-box__icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Search title, content, or author" />
        </label>
      </section>

      <section id="errorBox" class="state-card state-card--error hidden" role="alert"></section>
      <section id="loadingBox" class="state-card">Loading announcements...</section>

      <section id="cardsGrid" class="cards-grid hidden" aria-live="polite"></section>
      <section id="emptyState" class="state-card hidden">No announcements match your search.</section>
    </main>

    <template id="cardTemplate">
      <article class="card">
        <a class="card__link" href="#">
          <div class="card__body">
            <h2 class="card__title"></h2>
            <p class="card__desc"></p>
            <div class="card__meta">
              <span class="card__date"></span>
              <span class="card__author hidden"></span>
            </div>
          </div>
        </a>
      </article>
    </template>

    <script src="./app.js" defer></script>
  </body>
  </html>
